services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stackvault
      POSTGRES_USER: stackvault
      POSTGRES_PASSWORD: stackvault
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stackvault"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4"
    environment:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: "local-compose-secret"
      DATABASE_URL: "postgresql://stackvault:stackvault@postgres:5432/stackvault"
      REDIS_URL: "redis://redis:6379/0"
    ports:
      - "8000:8000"
    volumes:
      - mediadata:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: celery -A config worker -l info
    environment:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: "local-compose-secret"
      DATABASE_URL: "postgresql://stackvault:stackvault@postgres:5432/stackvault"
      REDIS_URL: "redis://redis:6379/0"
    volumes:
      - mediadata:/app/media
    depends_on:
      - backend

  beat:
    build: ./backend
    command: celery -A config beat -l info
    environment:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: "local-compose-secret"
      DATABASE_URL: "postgresql://stackvault:stackvault@postgres:5432/stackvault"
      REDIS_URL: "redis://redis:6379/0"
    depends_on:
      - backend

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
  mediadata:


# NOT the installed release. Production is ~/Projects/Personal/HomeLab-Redo/stackerstash.
# Do not helm upgrade the live stackerstash release with this chart.
# See openspec/specs/k3s-deployment/spec.md.
hostname: stackerstash.com

gateway:
  enabled: true
  name: traefik-gateway
  namespace: traefik
  sectionName: websecure

tls:
  enabled: true
  issuerName: letsencrypt-prod
  secretName: stackerstash-tls

backend:
  image: registry.homelab.local/stackerstash-backend:0.1.0
  replicas: 2
  port: 8000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

worker:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

frontend:
  image: registry.homelab.local/stackerstash-frontend:0.1.0
  replicas: 2
  port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

media:
  storageClassName: longhorn
  size: 20Gi
  mountPath: /app/media

env:
  DJANGO_DEBUG: "false"
  DATABASE_URL: "postgresql://stackerstash:changeme@postgresql.postgresql.svc.cluster.local:5432/stackerstash"
  REDIS_URL: "redis://redis.redis.svc.cluster.local:6379/0"
  SECRET_NAME: "stackerstash-secrets"


apiVersion: v1
kind: Service
metadata:
  name: stackerstash-backend
spec:
  selector:
    app: stackerstash-backend
  ports:
    - port: {{ .Values.backend.port }}
      targetPort: {{ .Values.backend.port }}
---
apiVersion: v1
kind: Service
metadata:
  name: stackerstash-frontend
spec:
  selector:
    app: stackerstash-frontend
  ports:
    - port: {{ .Values.frontend.port }}
      targetPort: {{ .Values.frontend.port }}


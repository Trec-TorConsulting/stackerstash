apiVersion: apps/v1
kind: Deployment
metadata:
  name: stackvault-frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app: stackvault-frontend
  template:
    metadata:
      labels:
        app: stackvault-frontend
    spec:
      containers:
        - name: frontend
          image: {{ .Values.frontend.image }}
          ports:
            - containerPort: {{ .Values.frontend.port }}
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}


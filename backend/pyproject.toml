[project]
name = "stackerstash-backend"
version = "0.1.0"
description = "Enterprise-grade multi-tenant backend for Stacker Stash (coins, paper currency, and bullion collection tracking)"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1,<6.0",
    "django-ninja>=1.3.0",
    "django-cors-headers>=4.6.0",
    "psycopg[binary]>=3.2.0",
    "celery>=5.4.0",
    "redis>=5.2.0",
    "cryptography>=44.0.0",
    "pillow>=11.0.0",
    "httpx>=0.28.0",
    "gunicorn>=23.0.0",
    "whitenoise>=6.8.0",
    "pyjwt>=2.10.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-django>=4.9.0",
    "respx>=0.22.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "-q --tb=short"

[tool.ruff]
line-length = 110
target-version = "py312"
exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

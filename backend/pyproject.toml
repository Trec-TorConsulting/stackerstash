[project]
name = "stackerstash-backend"
version = "0.1.0"
description = "Enterprise-grade multi-tenant backend for Stacker Stash (coins, paper currency, and bullion collection tracking)"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1,<6.0",
    "django-ninja>=1.3.0",
    "django-cors-headers>=4.6.0",
    "psycopg[binary]>=3.2.0",
    "celery>=5.4.0",
    "redis>=5.2.0",
    "cryptography>=44.0.0",
    "pillow>=11.0.0",
    "httpx>=0.28.0",
    "gunicorn>=23.0.0",
    "whitenoise>=6.8.0",
    "pyjwt>=2.10.0",
    "rapidocr-onnxruntime>=1.4.0",
    "pillow-heif>=1.8.1",
    "stripe>=11.0.0",
]

[dependency-groups]
dev = [
    "bandit>=1.8.0",
    "pip-audit>=2.7.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-django>=4.9.0",
    "respx>=0.22.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "-q --tb=short"

[tool.coverage.run]
source = ["apps", "config"]
omit = [
    "*/migrations/*",
    "config/wsgi.py",
    "config/asgi.py",
    "*/__init__.py",
]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 110
target-version = "py312"
exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108"]
